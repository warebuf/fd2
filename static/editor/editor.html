<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map Editor</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            font-family: sans-serif;
        }
        #container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        #options {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        #options button {
            padding: 4px 8px;
            font-size: 12px;
            line-height: 1;
        }

        #mouseTool {
            position: absolute;
            top: 170px;
            left: 10px;
            display: flex;
            flex-direction: row;
            gap: 10px;
            z-index: 10;
        }

        #selectTool {
            position: absolute;
            top: 220px;
            left: 10px;
            display: flex;
            flex-direction: row;
            gap: 10px;
            z-index: 10;
        }


        button, input[type="file"] {
            padding: 4px 8px;
            font-size: 12px;
            line-height: 1;
        }
        input[type="file"] {
            display: none;
        }
        label[for="fileUpload"] {
            background: #4CAF50;
            color: black;
            border: none;
            padding: 4px 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div id="container">
    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <label for="fileUpload">Upload File</label>
        <input type="file" id="fileUpload">
        <button id="downloadBtn">Download</button>
    </div>

    <div id="options">
        <button id="b1">Delete All Intersections</button>
        <button id="b3">Check For Overlaps</button>
        <button id="b5">Save Shape</button>
        <button id="b6">Draw Edges: Off</button>
    </div>

    <div id="mouseTool">
        <button id="b7">Draw: On</button>
        <button id="b8">Group: Off</button>
        <button id="b9">Select: Off</button>
    </div>

    <div id="selectTool">
        <button id="b10">LR Mirror</button>
        <button id="b11">UD Mirror</button>
        <button id="b12">Diagonal Mirror</button>
    </div>
</div>


<script type="module">

    import { Bezier } from "https://cdn.jsdelivr.net/npm/bezier-js@6.1.4/src/bezier.min.js";

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    var Obstacles = [];
    var ObstacleTypes = [];
    var Intersections = [];

    var Overlaps = new Map();
    var POI = new Map();

    var drawnPoints = [];
    var selectedPoints = [];
    var savedPoints = [];

    var tempEdges = [];

    var drawEdgesState = false;
    var mouseState = 0;

    var isSelecting = false;
    var selectingSquare = [0,0,0,0];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    }

    function draw() {
        ctx.fillStyle = "#1e1e1e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawMap()
        drawObstacles()
        drawEdges();
        drawIntersections();
        drawSavedPoints();
        drawDrawnPoints();
        drawRect();
    }

    function drawMap(){

        const squareSize = 500;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.strokeStyle = "white";
        ctx.lineWidth = 1;
        ctx.strokeRect(centerX-(squareSize/2), centerY-(squareSize/2), squareSize, squareSize);

    }

    function init() {

        for (let i = 0; i < Obstacles.length; i++) {
            if (ObstacleTypes[i] == "BEZIER") {

                const startKey = `${Obstacles[i][0]},${Obstacles[i][1]}`;
                const endKey = `${Obstacles[i][6]},${Obstacles[i][7]}`;
                Overlaps.set(startKey, (Overlaps.get(startKey) ?? 0) + 1);
                Overlaps.set(endKey, (Overlaps.get(endKey) ?? 0) + 1);

                const curve = new Bezier(Obstacles[i][0], Obstacles[i][1], Obstacles[i][2], Obstacles[i][3], Obstacles[i][4], Obstacles[i][5], Obstacles[i][6], Obstacles[i][7]);

                const orangePoint = curve.get(0);
                const k0 = [orangePoint.x, orangePoint.y, 'a'].join(',')
                POI.set(k0, true);

                const brownPoint = curve.get(1);
                const k3 = [brownPoint.x, brownPoint.y, 'b'].join(',')
                POI.set(k3, true);

                const extrema = curve.extrema()
                for(let j = 0; j < extrema.values.length; j++) {
                    const bluePoint = curve.get(extrema.values[j])
                    const key0 = [bluePoint.x, bluePoint.y, 'e'].join(',')
                    POI.set(key0, true)
                }
            }
        }
    }

    function drawObstacles(){

        const squareSize = 500;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.strokeStyle = "white";
        for (let i = 0; i < Obstacles.length; i++) {
            if (ObstacleTypes[i] == "BEZIER") {

                ctx.beginPath();
                ctx.moveTo(centerX - (squareSize/2) + Obstacles[i][0], centerY + (squareSize/2) - Obstacles[i][1]);
                ctx.bezierCurveTo(
                    centerX - (squareSize/2) + Obstacles[i][2], centerY + (squareSize/2) - Obstacles[i][3],
                    centerX - (squareSize/2) + Obstacles[i][4], centerY + (squareSize/2) - Obstacles[i][5],
                    centerX - (squareSize/2) + Obstacles[i][6], centerY + (squareSize/2) - Obstacles[i][7]
                );
                ctx.stroke();

            }
        }

        for (const key of POI.keys()) {
            let keyString = key.split(',')
            keyString[0] = parseFloat(keyString[0])
            keyString[1] = parseFloat(keyString[1])

            ctx.fillStyle = "blue";
            ctx.fillRect(centerX - (squareSize/2) + keyString[0]-1, centerY + (squareSize/2) - keyString[1]-1, 3, 3);


        }

    }

    function drawIntersections(){
        const squareSize = 500;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.fillStyle = "red";
        for (let i = 0; i < Intersections.length; i++) {
            ctx.fillRect(centerX - (squareSize/2) + Intersections[i][0], centerY + (squareSize/2) - Intersections[i][1], 1, 1);
        }
    }

    function drawDrawnPoints() {
        const squareSize = 500;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.fillStyle = "red";
        for (let i = 0; i < drawnPoints.length; i++) {

            if(selectedPoints[i]) {
                ctx.fillStyle = "yellow";
            } else {
                ctx.fillStyle = "red";
            }

            ctx.fillRect(centerX - (squareSize/2) + drawnPoints[i][0] , centerY + (squareSize/2) - drawnPoints[i][1] , 1, 1);
        }
    }

    function drawSavedPoints() {
        const squareSize = 500;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.fillStyle = "green";
        for (let i = 0; i < savedPoints.length; i++) {
            ctx.fillRect(centerX - (squareSize/2) + savedPoints[i][0] , centerY + (squareSize/2) - savedPoints[i][1] , 1, 1);
        }
    }

    function deleteAllIntersections(){
        Intersections = [];
        draw();
    }

    function checkForOverlaps() {
        for (const [key, val] of Overlaps) {
            if(val <= 1) {
                console.log(key, val)
            }
        }
    }

    function euclideanDistance(x1,y1,x2,y2) {
        const x = x2 - x1
        const y = y2 - y1
        return Math.sqrt(x*x + y*y)
    }

    function saveShape() {
        for(let i = 0 ; i < drawnPoints.length; i++) {
            savedPoints.push(drawnPoints[i]);
        }
        drawnPoints = [];
        selectedPoints = [];
        tempEdges = [];
    }

    function findEdges() {

        tempEdges = [];

        for(let i = 0; i < drawnPoints.length; i++) {
            for(let j = i + 1; j < drawnPoints.length; j++) {
                const line = { p1: { x: drawnPoints[i][0], y: drawnPoints[i][1] }, p2: { x: drawnPoints[j][0], y: drawnPoints[j][1] } };
                let intersects = false;
                for(let k = 0; k < Obstacles.length; k++) {
                    if(ObstacleTypes[k] == "BEZIER") {
                        const curve = new Bezier(Obstacles[k][0], Obstacles[k][1], Obstacles[k][2], Obstacles[k][3], Obstacles[k][4], Obstacles[k][5], Obstacles[k][6], Obstacles[k][7]);
                        const intersections = curve.intersects(line);
                        if(intersections.length > 0) {
                            intersects = true;
                            break;
                        }
                    }
                }
                if(intersects === false) {
                    tempEdges.push( [drawnPoints[i][0],drawnPoints[i][1],drawnPoints[j][0],drawnPoints[j][1]] )
                }
            }
        }

    }

    function drawEdges() {

        if(drawEdgesState) {
            ctx.strokeStyle = "grey";
            const squareSize = 500;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            for (let i = 0; i < tempEdges.length; i++) {
                ctx.beginPath();    // Begin a new path
                ctx.moveTo(centerX - (squareSize/2) + tempEdges[i][0], centerY + (squareSize/2) - tempEdges[i][1] ); // Move to the starting point
                ctx.lineTo(centerX - (squareSize/2) + tempEdges[i][2], centerY + (squareSize/2) - tempEdges[i][3] ); // Draw a line to the ending point
                ctx.stroke();       // Render the line
            }
        }



    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();



    const fileInput = document.getElementById('fileUpload');
    fileInput.addEventListener('change', (event) => {
        const file = event.target.files[0]; // grab the first file the user uploaded
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {

                drawnPoints = [];
                savedPoints = [];
                Obstacles = [];
                ObstacleTypes = [];
                let lines = e.target.result.replace(/\r\n/g, '\n').split('\n');
                for (let i = 0; i < lines.length; i++) {
                    let jsonObject = JSON.parse(lines[i])

                    if(jsonObject.Type == "INT") {
                        drawnPoints.push([jsonObject.X,jsonObject.Y]);
                    }
                    else if(jsonObject.Type == "OBS") {
                        if(jsonObject.Shape=="BEZIER") {
                            Obstacles.push([jsonObject.X1,jsonObject.Y1,jsonObject.X2,jsonObject.Y2,jsonObject.X3,jsonObject.Y3,jsonObject.X4,jsonObject.Y4]);
                            ObstacleTypes.push("BEZIER");
                        }
                        else if(jsonObject.Shape=="CIRCLE") {
                        }
                    }
                }

                init();
                draw();

            };
            reader.readAsText(file);
        }
    });

    document.addEventListener("click", function(event) {

        if(mouseState === 0) {
            const squareSize = 500;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const clickX = event.clientX-centerX+(squareSize/2);
            const clickY = -(event.clientY-centerY-(squareSize/2));
            console.log("click location", clickX, clickY );
            if(clickX >= 0 && clickX <= 500 && clickY >=0 && clickY<=500) {
                drawnPoints.push([clickX, clickY]);
                selectedPoints.push(false);
            }
            findEdges();
            draw();
        }

    })

    document.addEventListener("contextmenu", function(event) {

        event.preventDefault();

        if(mouseState === 0) {
            drawnPoints.pop();
            selectedPoints.pop();
            findEdges();
            draw();
        } else if(mouseState === 1) {
            deleteSelected()
        } else if(mouseState === 2) {
            deleteSelected()
        }

    })

    document.getElementById('downloadBtn').addEventListener('click', () => {

        let strings = [];
        for(let i = 0; i < Obstacles.length; i++) {
            if(ObstacleTypes[i] === "BEZIER") {
                const obstacle = {
                    Type: "OBS",
                    X1: Obstacles[i][0],
                    Y1: Obstacles[i][1],
                    X2: Obstacles[i][2],
                    Y2: Obstacles[i][3],
                    X3: Obstacles[i][4],
                    Y3: Obstacles[i][5],
                    X4: Obstacles[i][6],
                    Y4: Obstacles[i][7],
                    Shape: "BEZIER"
                };
                strings.push(JSON.stringify(obstacle))
            }
        }

        // create edges for intersections
        let edgesMap = new Map();
        for(let i = 0; i < savedPoints.length; i++) {
            for(let j = i+1; j < savedPoints.length; j++) {
                const line = { p1: { x: savedPoints[i][0], y: savedPoints[i][1] }, p2: { x: savedPoints[j][0], y: savedPoints[j][1] } };
                let intersects = false;
                for(let k = 0; k < Obstacles.length; k++) {
                    const curve = new Bezier(Obstacles[k][0], Obstacles[k][1], Obstacles[k][2], Obstacles[k][3], Obstacles[k][4], Obstacles[k][5], Obstacles[k][6], Obstacles[k][7]);
                    const intersections = curve.intersects(line);
                    if(intersections.length > 0) {
                        intersects = true;
                        break;
                    }
                }
                if(intersects === false) {
                    if(!edgesMap.has(i)) { edgesMap.set(i, [j]);}
                    else { edgesMap.get(i).push(j); }

                    if(!edgesMap.has(j)) { edgesMap.set(j, [i]);}
                    else { edgesMap.get(j).push(i); }
                }
            }
        }

        for(let i = 0; i < savedPoints.length; i++) {
            if(edgesMap.has(i)) {
                let edgeLengths = [];
                let filteredEdges = [];

                const edgeIndexes = edgesMap.get(i);
                for(let j = 0; j < edgeIndexes.length; j++) {
                    const euclid = euclideanDistance(savedPoints[i][0],savedPoints[i][1],savedPoints[edgeIndexes[j]][0],savedPoints[edgeIndexes[j]][1]);
                    if(euclid > 0.0001) {
                        edgeLengths.push( euclid );
                        filteredEdges.push( edgeIndexes[j] );
                    }
                }

                const intersection = {
                    Type: "INT",
                    X: savedPoints[i][0],
                    Y: savedPoints[i][1],
                    EdgeLengths: edgeLengths,
                    Edges: filteredEdges,
                };

                strings.push(JSON.stringify(intersection))
            }
        }


        const data = strings.join('\n');
        const blob = new Blob([data], { type: "text/plain" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = "fdmap.txt";
        a.click();

        URL.revokeObjectURL(url);
    });

    document.getElementById('b1').addEventListener('click', () => {
        deleteAllIntersections()
    })

    document.getElementById('b3').addEventListener('click', () => {
        checkForOverlaps()
    })

    document.getElementById('b5').addEventListener('click', () => {
        saveShape();
    })

    document.getElementById('b6').addEventListener('click', () => {
        findEdges();
        drawEdgesState = !drawEdgesState;
        const btn = document.getElementById('b6');
        btn.textContent = `Draw Edges: ${drawEdgesState ? 'On' : 'Off'}`;
        draw();
    })

    function changeMouseButtons() {
        const btn1 = document.getElementById('b7');
        btn1.textContent = `Draw: ${mouseState === 0 ? 'On' : 'Off'}`;
        const btn2 = document.getElementById('b8');
        btn2.textContent = `Group: ${mouseState === 1 ? 'On' : 'Off'}`;
        const btn3 = document.getElementById('b9');
        btn3.textContent = `Select: ${mouseState === 2 ? 'On' : 'Off'}`;
    }

    document.getElementById('b7').addEventListener('click', () => {
        mouseState = 0;
        isSelecting = false;
        changeMouseButtons();
    })

    document.getElementById('b8').addEventListener('click', () => {
        mouseState = 1;
        isSelecting = false;
        changeMouseButtons();
    })

    document.getElementById('b9').addEventListener('click', () => {
        mouseState = 2;
        isSelecting = false;
        changeMouseButtons()
    })

    document.getElementById('b10').addEventListener('click', () => {
        LRMirror();
    })

    document.getElementById('b11').addEventListener('click', () => {
        UDMirror();
    })

    document.getElementById('b12').addEventListener('click', () => {
        diagonalMirror();
    })

    window.addEventListener('keydown', function(event) {
        if (event.key === 'e' || event.key === 'E') {
            findEdges();
            drawEdgesState = !drawEdgesState;
            const btn = document.getElementById('b6');
            btn.textContent = `Draw Edges: ${drawEdgesState ? 'On' : 'Off'}`;
            draw();
        } else if(event.key === 's' || event.key === 'S') {
            saveShape()
        }
    });

    canvas.addEventListener('mousedown', (e) => {
        if(e.button === 0 && mouseState === 1) {
            isSelecting = true;
            const rect = canvas.getBoundingClientRect();
            selectingSquare[0] = e.clientX - rect.left;
            selectingSquare[1] = e.clientY - rect.top;
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if(e.button === 0 && mouseState === 1 && isSelecting === true) {
            const rect = canvas.getBoundingClientRect();
            selectingSquare[2] = e.clientX - rect.left;
            selectingSquare[3] = e.clientY - rect.top;
            draw();
        }
    });

    canvas.addEventListener('mouseup', (e) => {
        if (e.button === 0 && mouseState === 1) {

            isSelecting = false;

            const squareSize = 500;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const cornerX1 = selectingSquare[0]-centerX+(squareSize/2);
            const cornerY1 = -(selectingSquare[1]-centerY-(squareSize/2));
            const cornerX2 = selectingSquare[2]-centerX+(squareSize/2);
            const cornerY2 = -(selectingSquare[3]-centerY-(squareSize/2));

            const minX = Math.min(cornerX1, cornerX2);
            const maxX = Math.max(cornerX1, cornerX2);
            const minY = Math.min(cornerY1, cornerY2);
            const maxY = Math.max(cornerY1, cornerY2);

            for(let i = 0; i < drawnPoints.length; i++) {
                if(drawnPoints[i][0] >= minX && drawnPoints[i][0] <= maxX && drawnPoints[i][1] >= minY && drawnPoints[i][1] <= maxY ) {
                    selectedPoints[i] = true;
                } else {
                    selectedPoints[i] = false;
                }
            }

            draw();
        }
    });

    function drawRect() {

        if (mouseState === 1 && isSelecting) {
            ctx.strokeStyle = 'red';
            ctx.setLineDash([6]);
            ctx.strokeRect(
                Math.min(selectingSquare[0], selectingSquare[2]),
                Math.min(selectingSquare[1], selectingSquare[3]),
                Math.abs(selectingSquare[2] - selectingSquare[0]),
                Math.abs(selectingSquare[3] - selectingSquare[1])
            );
            ctx.setLineDash([]); // reset dash
        }

    }

    function LRMirror() {
        const squareSize = 500;
        const pointSet = new Set(drawnPoints.map(p => `${p[0]},${p[1]}`));

        const originalLength = drawnPoints.length;
        for (let i = 0; i < originalLength; i++) {
            if (selectedPoints[i] === true) {
                const mirrored = [squareSize - drawnPoints[i][0], drawnPoints[i][1]];
                const key = `${mirrored[0]},${mirrored[1]}`;
                if (!pointSet.has(key)) {
                    drawnPoints.push(mirrored);
                    selectedPoints.push(true);
                    pointSet.add(key);
                }
            }
        }

        findEdges();
        draw();
    }

    function UDMirror() {
        const squareSize = 500;
        const pointSet = new Set(drawnPoints.map(p => `${p[0]},${p[1]}`));

        const originalLength = drawnPoints.length;
        for (let i = 0; i < originalLength; i++) {
            if (selectedPoints[i] === true) {
                const mirrored = [drawnPoints[i][0], squareSize - drawnPoints[i][1]];
                const key = `${mirrored[0]},${mirrored[1]}`;
                if (!pointSet.has(key)) {
                    drawnPoints.push(mirrored);
                    selectedPoints.push(true);
                    pointSet.add(key);
                }
            }
        }

        findEdges();
        draw();
    }

    function diagonalMirror() {
        const squareSize = 500;
        const pointSet = new Set(drawnPoints.map(p => `${p[0]},${p[1]}`));

        const originalLength = drawnPoints.length;
        for (let i = 0; i < originalLength; i++) {
            if (selectedPoints[i] === true) {
                const mirrored = [squareSize - drawnPoints[i][0], squareSize - drawnPoints[i][1]];
                const key = `${mirrored[0]},${mirrored[1]}`;
                if (!pointSet.has(key)) {
                    drawnPoints.push(mirrored);
                    selectedPoints.push(true);
                    pointSet.add(key);
                }
            }
        }

        findEdges();
        draw();
    }

    function deleteSelected() {
        const newArr = [];
        for(let i = 0; i < drawnPoints.length; i++) {
            if(selectedPoints[i] === false) {
                newArr.push(drawnPoints[i]);
            }
        }
        drawnPoints = newArr;
        selectedPoints = Array(drawnPoints.length).fill(false);
        findEdges();
        draw();
    }







</script>
</body>
</html>
