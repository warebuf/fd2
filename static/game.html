<html lang="en">
<head>
    <title>.</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #container {
            position: relative;
        }

        #test {
            position: absolute;
            padding: 0px;
            text-align: center;
            max-width: 100%;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            top: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #sel_but {
            padding: 0px;
            text-align: center;

            position: absolute;
            right: 10px;
            top: 10px;
        }

        #fps {
            position: fixed;
            top: 10px;
            left: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px;
            border-radius: 5px;
            z-index: 1;
        }

        #myCanvas {
            z-index: 0;
        }

    </style>
</head>

<body>

<div id="fps">FPS: 0</div>

<div id="container">

    <div id="sel_but"></div>
    <div id="test"></div>
    <div id="settings"></div>

    <canvas id="myCanvas"></canvas>

</div>



<script src="https://cdn.socket.io/socket.io-3.0.5.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bezier-js@6.1.4/src/bezier.min.js"></script>
<script  type="module" src="/static/engine.js"></script>

</body>
</html>
