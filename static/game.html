<script src="https://cdn.socket.io/socket.io-3.0.5.js"></script>

<script type="text/javascript">
    sourceURL="test.js"

    document.onkeydown = function (e) {
        switch (e.key) {

            case 'E':
            case 'e':
            case "Enter":
                if(phase=="CHARACTER SELECTION"){

                    if(second_index==false) {
                        second_index=true

                        screen_index_2 = screen_index
                        x_index_2=x_index_1
                        if(screen_index==1) {
                            if(x_index_1==0) {y_index_2=y_index_1+h_index}
                            else if(x_index_1==1){y_index_2=y_index_1+l_index}
                            else if(x_index_1==2){y_index_2=y_index_1+r_index}
                            else if(x_index_1==3){y_index_2=y_index_1+b_index}
                        } else {y_index_2=y_index_1}

                    }
                    else if(second_index==true){

                        if(x_index_1==x_index_2) {

                            let y1 = ""
                            if(screen_index==1){
                                if(x_index_1==0){
                                    y1 = y_index_1+h_index
                                } else if(x_index_1==1) {
                                    y1 = y_index_1+l_index
                                } else if(x_index_1==2) {
                                    y1 = y_index_1+r_index
                                } else if(x_index_1==3) {
                                    y1 = y_index_1+b_index
                                }

                            } else{
                                y1 = y_index_1
                            }

                            s = screen_index + ';' + x_index_1 + ';' + y1 + ';' + screen_index_2 + ';' + x_index_2 + ';' + y_index_2
                            socket.send(JSON.stringify({ "Event": "swapRequest", "Message": s }))
                            console.log("sent swapreq")
                        } else{
                            console.log("CANNOT SWAP INCOMPATIBLE BODY PARTS")
                            err_msg_index=1
                        }

                        second_index=false
                    }
                }
                else {
                    console.log("enter")

                    if(state_machine==0) {
                        // if the current hoverable is a unit, continue
                        if((hoverable.Type == "unit") && (hoverable.I == my_team) && (hoverable.J == my_int) && ((state[hoverable.I][hoverable.J][hoverable.K].Status==0)) || ((state[hoverable.I][hoverable.J][hoverable.K].Status==1) && coordinateEqual(state[hoverable.I][hoverable.J][hoverable.K].Position, state[hoverable.I][hoverable.J][hoverable.K].Start) )) {
                            selected_hoverable = hoverable;
                            state_machine = 1;
                            setupHoverable();
                        }
                    } else if(state_machine==1) {
                        // if the current hoverable is a POA, continue
                        socket.send(JSON.stringify({ "Event": 'act', "Message": action_buffer, "Team_index": my_team, "Client_index": my_int, "Hero_index": selected_hoverable.K, Route: hoverable }))
                        selected_hoverable = null;
                        state_machine = 0;
                        setupHoverable();
                    }

                }
                break;

            case 'C':
            case 'c':
                if(view==0){view=1}
                else if(view==1){view=2}
                else if(view==2){view=3}
                else if(view==3){view=0}
                break;

            case 'A':
            case 'a':
            case "ArrowLeft":

                if(phase=="CHARACTER SELECTION"){

                    x_index_1 = x_index_1 -1
                    if(x_index_1 < 0) {
                        x_index_1 = 3
                    }
                }
                else if(match_data.length>0){
                    calculateNextHoverable(1);
                }

                break;
            case 'D':
            case 'd':
            case "ArrowRight":

                if(phase=="CHARACTER SELECTION"){
                    x_index_1 = x_index_1 + 1
                    if(x_index_1 > 3) {
                        x_index_1 = 0
                    }
                }
                else if(match_data.length>0){
                    calculateNextHoverable(2);
                }

                break;
            case 'W':
            case 'w':
            case "ArrowUp":
                if(phase=="CHARACTER SELECTION") {

                    if(screen_index==1) {
                        if(x_index_1==0) { //h case
                            y_index_1 = y_index_1 - 1
                            if(y_index_1 < 0) {
                                if(h_index>0) {
                                    h_index = h_index-1
                                    y_index_1 = 0
                                } else{
                                    screen_index = 0
                                    y_index_1 = 4
                                }
                            }
                        }else if(x_index_1==1){
                            y_index_1 = y_index_1 - 1
                            if(y_index_1 < 0) {
                                if(l_index>0) {
                                    l_index = l_index-1
                                    y_index_1 = 0
                                } else{
                                    screen_index = 0
                                    y_index_1 = 4
                                }
                            }
                        }else if(x_index_1==2){
                            y_index_1 = y_index_1 - 1
                            if(y_index_1 < 0) {
                                if(r_index>0) {
                                    r_index = r_index-1
                                    y_index_1 = 0
                                } else{
                                    screen_index = 0
                                    y_index_1 = 4
                                }
                            }
                        }else if(x_index_1==3){
                            y_index_1 = y_index_1 - 1
                            if(y_index_1 < 0) {
                                if(b_index>0) {
                                    b_index = b_index-1
                                    y_index_1 = 0
                                } else{
                                    screen_index = 0
                                    y_index_1 = 4
                                }
                            }
                        }
                    } else {
                        y_index_1 = y_index_1 - 1
                        if(y_index_1 < 0) {
                            screen_index=1
                            y_index_1=4
                        }
                    }
                }
                else if(match_data.length>0){
                    calculateNextHoverable(0);
                }
                break;
            case 'S':
            case 's':
            case "ArrowDown":
                if(phase=="CHARACTER SELECTION") {

                }
                else if(match_data.length>0){
                    calculateNextHoverable(3);
                }
                break;

            case ' ':
                if(game_over==true) {
                    returntomatchmaking()
                }
                break;
            case "Escape":
                if(settings_menu==0){
                    settings_menu=1
                    document.getElementById("settings").insertAdjacentHTML('beforeend',"<button id='resign' onclick=resign()>Resign</button>");
                }
                else{
                    settings_menu=0
                    let s = document.getElementById("settings").getElementsByTagName("button")
                    s[0].remove()
                }
                break;

            case 'Q':
            case 'q':
            case "Backspace":
                if(state_machine==1) {
                    state_machine = 0;
                    selected_hoverable = null;
                    setupHoverable();
                }
                break;
        }
    }

    // important data
    var socket = null; // socket object for this tab
    var my_team = -1; // the user's team index
    var my_int = -1; // the user's player index

    // state stuff
    var animating_state = -1 // where are we at in the dataset
    var phase = "null";
    var turn = "null"; // the current phase/turn
    var sent_time = null; // the time that the turn ends

    var game_over = false;

    var attacking_frames_count = 0

    // the board state
    var state = []
    var camps = [];

    var h_index = 0
    var l_index = 0
    var r_index = 0
    var b_index = 0

    var bench = null
    var bench_index = 0

    var screen_index = 0
    var x_index_1 = 0
    var y_index_1 = 0
    var second_index = false
    var screen_index_2 = 0
    var x_index_2 = 0
    var y_index_2 = 0

    var err_msg_index = 0
    var err_count = 0

    // datasets
    var match_data = new Array();
    var atk_data = new Array();
    var camp_data = new Array();

    var time_queue = []
    var turn_queue = []
    var event_log = []

    var damageNumbers = []; // UI related, holds the damage number animation

    var frame_count = 0;
    var state_machine = 0;
    var even = 0; // just a small global variable to let us know when to flash camp icons
    var action_buffer = ""

    var hoverable = null;
    var hoverable_coordinate = null;
    var selected_hoverable = null;

    var total_units_of_time = 0;

    var view = 0;
    var settings_menu = 0;

    function reception() {

        if (!window["WebSocket"]) {
            alert("Error: Your browser does not support web sockets.")
        } else {
            socket = new WebSocket("ws://{{.host}}/msocket?matchid={{.mid}}");
            socket.onclose = function() {
                alert("Connection has been closed.");
            }

            socket.onmessage = function(e) {
                var receive_time = Date.now()
                var msg = eval('('+e.data+')');
                console.log("msg_init", msg.Event, msg.Name, msg.MatchID, msg.Message, msg.TCH, msg.Turn, msg.Spawns, msg.POAs);

                var msg_date = msg.When.substring(0,10);
                var msg_time = msg.When.substring(11,19);

                if(msg.Event == 'clockSyncRequest') {
                    console.log("dif", Date.parse(msg.When) - receive_time)
                    socket.send(JSON.stringify({ "Event": 'clockSyncResponse', "Message": receive_time.toString() }))
                }
                else if(msg.Event == 'entered') {
                    event_log.push(msg_date + ' ' + msg_time + ' ' + msg.Name + ' has entered the game')
                    if(event_log.length >= 25) {
                        event_log.shift()
                    }
                }
                else if(msg.Event == 'left') {
                    event_log.push(msg_date + ' ' + msg_time + ' ' + msg.Name + ' has left the game')
                    if(event_log.length >= 25) {
                        event_log.shift()
                    }
                }
                else if(msg.Event == 'assignInt') {
                    let temp_string = msg.Message.split(";")
                    my_team = parseInt(temp_string[0])
                    my_int = parseInt(temp_string[1])
                }
                else if(msg.Event == 'ticker_start') {
                    sent_time = Date.parse(msg.Message)
                }
                else if(msg.Event == 'bench'){
                    bench = JSON.parse(msg.Message)
                }
                else if(msg.Event == 'update_phase') {
                    if (phase=="null") {
                        phase = msg.Phase
                        if(phase=="CHARACTER SELECTION") {
                            document.getElementById("sel_but").insertAdjacentHTML('beforeend',"<button id='a1' onclick=endCharSelect()>finished</button>");
                        }
                    } else if(phase=="CHARACTER SELECTION") {
                        var menu2 = document.getElementById("sel_but");
                        menu2.remove();
                        phase = msg.Phase
                    }
                }
                else if(msg.Event == 'sel_finished') {
                    event_log.push(msg_date + ' ' + msg_time + ' ' + msg.Name + ' finished unit selection.')
                    if(event_log.length >= 25) {
                        event_log.shift()
                    }
                }
                else if(msg.Event == 'game_state') {
                    console.log("received game_state")

                    if(phase=="CHARACTER SELECTION") {
                        let temp = msg.TCH;
                        let md = [];
                        for (i = 0; i < temp.length; i++) {
                            md[i] = new Array();
                            for (j = 0; j < temp[i].length; j++) {
                                md[i][j] = new Array();
                                for (k = 0; k < temp[i][j].length; k++ ){
                                    md[i][j][k] = JSON.parse(temp[i][j][k]);
                                }
                            }
                        }

                        let cdata = [];
                        for(let i = 0; i < msg.Camps.length; i++) {
                            cdata.push(JSON.parse(msg.Camps[i]))
                        }

                        state = md
                        camps = cdata

                    } else {
                        turn_queue.push(msg.Turn)
                        time_queue.push(msg.UnitsOfTime)

                        // turn the JSON into javascript objects
                        let temp = msg.TCH;
                        let md = [];
                        for (let i = 0; i < temp.length; i++) {
                            md[i] = new Array();
                            for (j = 0; j < temp[i].length; j++) {
                                md[i][j] = new Array();
                                for (k = 0; k < temp[i][j].length; k++ ){
                                    md[i][j][k] = JSON.parse(temp[i][j][k]);
                                }
                            }
                        }

                        let cdata = [];
                        for(let i = 0; i < msg.Camps.length; i++) {
                            cdata.push(JSON.parse(msg.Camps[i]))
                        }


                        // this triggers if they refreshed the page
                        if(animating_state == -1) {
                            let temp_string = msg.Message.split(";")
                            my_team = parseInt(temp_string[0])
                            my_int = parseInt(temp_string[1])
                            state = md;
                            animating_state = 0
                            camps = cdata
                            setupHoverable()
                        }

                        match_data.push(md)
                        camp_data.push(cdata)

                        if(msg.Atk == null) {
                            atk_data.push([])
                        } else {
                            atk_data.push(msg.Atk)
                        }
                    }
                }
                else if(msg.Event == 'game_over') {
                    game_over = true
                    document.getElementById("test").insertAdjacentHTML('beforeend',"<button id='b1' onclick=returntomatchmaking()>RETURN TO MATCHMAKING</button>");
                }
            }
        }
    }
    reception()

function returntomatchmaking(){
    window.location.href = 'http://{{.host}}/waitroom'
}

function endCharSelect(){
    socket.send(JSON.stringify({ "Event": 'endCharSel' }))
}

function resign(){
    socket.send(JSON.stringify({ "Event": 'resign' }))
}

function setupHoverable() {

    let mostNorthActive = null;
    let mostNorthCoordinate = null;

    if(state_machine == 0) {
        for(let i = 0; i < state[my_team][my_int].length; i++) {
            if(state[my_team][my_int][i].Status==0) {
                if(mostNorthActive == null) {
                    mostNorthActive = state[my_team][my_int][i].Position
                } else if(mostNorthActive.Y < state[my_team][my_int][i].Position.Y) {
                    mostNorthActive = state[my_team][my_int][i].Position
                }
            } else {
                if(mostNorthCoordinate == null) {
                    mostNorthCoordinate = state[my_team][my_int][i].Position
                } else if(mostNorthCoordinate.Y < state[my_team][my_int][i].Position.Y) {
                    mostNorthCoordinate = state[my_team][my_int][i].Position
                }
            }
        }
    } else if(state_machine == 1) {
        for(let i = 0; i < camps.length; i++) {
            if(mostNorthCoordinate == null) {
                mostNorthCoordinate = camps[i].XY
            } else if(mostNorthCoordinate.Y < camps[i].XY.Y) {
                mostNorthCoordinate = camps[i].XY
            }
        }
    }

    if(mostNorthActive!=null){hoverable=mostNorthActive;}
    else {hoverable = mostNorthCoordinate;}

    if(hoverable!=null) {
        if(hoverable.Type=="camp") {
            hoverable_coordinate = null;
        } else if(hoverable.Type=="unit"){
            hoverable_coordinate = state[hoverable.I][hoverable.J][hoverable.K]
        }
    }

}

function followHoverable() {
        if(hoverable_coordinate != null) {
            hoverable = hoverable_coordinate.Position
        }
}

function calculateNextHoverable(direction) {
    let hoverables = []

    if(state_machine == 0) {
        for(let i = 0 ; i < state.length; i++) {
            for(let j = 0; j < state[i].length; j++) {
                for(let k = 0 ; k < state[i][j].length; k++) {
                    hoverables.push(state[i][j][k].Position)
                }
            }
        }
    }

    if(camps.length > 0) {
        for(let i = 0; i < camps.length; i++) {
            hoverables.push(camps[i].XY)
        }
    }

    // next figure out the U,L,R,D
    let closestCardinalCoordinate = null;
    let closestCardinalDistance = Number.MAX_SAFE_INTEGER;

    let closestWrapCoordinate = null; // this handles wrapping
    let closestWrapDistance = Number.MAX_SAFE_INTEGER;

    let sameCoordinate = []

    for(let i = 0; i < hoverables.length; i++) {
        let dist = getDistance(hoverable, hoverables[i])

        if(dist==0){
            sameCoordinate.push(hoverables[i]);
            continue;
        }

        if(direction==0) {
            if(hoverables[i].Y>hoverable.Y) {
                let dist = getDistance(hoverable, hoverables[i])
                if(closestCardinalDistance>dist) {
                    closestCardinalCoordinate = hoverables[i];
                    closestCardinalDistance = dist;
                }
            }
        } else if(direction==1) {
            if(hoverable.X > hoverables[i].X) {
                let dist = getDistance(hoverable, hoverables[i])
                if(closestCardinalDistance>dist) {
                    closestCardinalCoordinate = hoverables[i];
                    closestCardinalDistance = dist;
                }
            }
        } else if(direction==2) {
            if(hoverable.X < hoverables[i].X) {
                let dist = getDistance(hoverable, hoverables[i])
                if(closestCardinalDistance>dist) {
                    closestCardinalCoordinate = hoverables[i];
                    closestCardinalDistance = dist;
                }
            }
        } else if(direction==3) {
            if(hoverables[i].Y<hoverable.Y) {
                let dist = getDistance(hoverable, hoverables[i])
                if(closestCardinalDistance>dist) {
                    closestCardinalCoordinate = hoverables[i];
                    closestCardinalDistance = dist;
                }
            }
        }

        if((closestCardinalCoordinate == null) && (dist != 0)) {
            let wrap_x = 0;
            let wrap_y = 0;
            if(direction==0) {
                wrap_y = -200;
            } else if(direction==1) {
                wrap_x = 200;
            } else if(direction==2) {
                wrap_x = -200;
            } else if(direction==3) {
                wrap_y = 200;
            }

            let wrap = structuredClone(hoverable); // deep copy of coordinate
            wrap.X = wrap.X + wrap_x;
            wrap.Y = wrap.Y + wrap_y;

            let wrapDist = getDistance(wrap, hoverables[i]);
            if(closestWrapDistance>wrapDist) {
                closestWrapCoordinate = hoverables[i];
                closestWrapDistance = wrapDist;
            }
        }
    }

    let found = false;
    // sort the coordinates at the current hoverable spot, find the next hoverable
    if( (sameCoordinate.length > 1) && (hoverable != null) ) {
        let sortedSameCoordinates = quicksortCoordinates(sameCoordinate);
        for(let i = 0 ; i < sortedSameCoordinates.length; i++) {
            if(
                (hoverable.Type == sortedSameCoordinates[i].Type) &&
                (hoverable.I == sortedSameCoordinates[i].I) &&
                (hoverable.J == sortedSameCoordinates[i].J) &&
                (hoverable.K == sortedSameCoordinates[i].K)
            ) {
                if( (direction==0) || (direction==2) ) {
                    if(i+1<sortedSameCoordinates.length) {
                        hoverable = sortedSameCoordinates[i+1]
                        found = true;
                    }
                } else {
                    if(i>0) {
                        hoverable = sortedSameCoordinates[i-1]
                        found = true;
                    }
                }
            }
        }
    }
    // if no coordinates at the same spot, get the closest one OR wrap
    if(found==false) {
        if(closestCardinalCoordinate != null) {
            hoverable = closestCardinalCoordinate;
        } else if(closestWrapCoordinate != null) {
            hoverable = closestWrapCoordinate;
        }
    }

    if(hoverable!=null) {
        if(hoverable.Type=="camp") {
            hoverable_coordinate = null;
        } else if(hoverable.Type=="unit"){
            hoverable_coordinate = state[hoverable.I][hoverable.J][hoverable.K]
        }
    }

}

function quicksortCoordinates(arr) {
    let stack = [];

    // Push initial values of low and high to the stack
    stack.push(0);
    stack.push(arr.length - 1);

    // Keep popping from the stack while it is not empty
    while (stack.length > 0) {
        // Pop high and low from the stack
        let high = stack.pop();
        let low = stack.pop();

        if (low < high) {
            // Partition the array and get the pivot index
            let pivot = arr[high];
            let i = low - 1;

            for (let j = low; j < high; j++) {

                let swap = false;
                if ((arr[j].Type=="unit") && (pivot.Type=="camp")) {
                    swap = true;
                } else if ((arr[j].Type=="unit") && (pivot.Type=="unit")) {
                    if(arr[j].I < pivot.I) {
                        swap = true;
                    } else if(arr[j].I==pivot.I) {
                        if(arr[j].J<pivot.J) {
                            swap = true;
                        } else if(arr[j].K==pivot.K) {
                            if(arr[j].K<pivot.K) {
                                swap = true;
                            }
                        }
                    }
                } else if ((arr[j].Type=="camp") && (pivot.Type=="camp")) {
                    if(arr[j].I < pivot.I) {
                        swap = true;
                    }
                }

                if (swap) {
                    i++;
                    [arr[i], arr[j]] = [arr[j], arr[i]]; // Swap elements
                }
            }

            // Place pivot in its correct position
            [arr[i + 1], arr[high]] = [arr[high], arr[i + 1]];
            let pivotIndex = i + 1;

            // Push left side of the pivot to the stack
            if (pivotIndex - 1 > low) {
                stack.push(low);
                stack.push(pivotIndex - 1);
            }

            // Push right side of the pivot to the stack
            if (pivotIndex + 1 < high) {
                stack.push(pivotIndex + 1);
                stack.push(high);
            }
        }
    }

    return arr;
}
