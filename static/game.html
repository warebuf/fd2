    function calculateNextHoverable(direction) {

        let current = [];
        if(hovIdx.length === 1) {
            current = camps[hovIdx[0]];
        } else if(hovIdx.length === 3) {
            current = state[hovIdx[0]][hovIdx[1]][hovIdx[2]];
        } else {
            return;
        }
        
        let hoverables = [];
        let bestDist = Infinity;
        let best = null;

        let rotationIndexes = new Map();

        // flatten entities into an array, also save entities on the same position as hoverable
        for (let i = 0; i < state.length; i++) {
            for (let j = 0; j < state[i].length; j++) {
                for (let k = 0; k < state[i][j].length; k++) {
                    hoverables.push(state[i][j][k]);

                    if( state[i][j][k].Position[0] === current.Position[0] && state[i][j][k].Position[1] === current.Position[1]) {
                        rotationIndexes.set(`${i},${j},${k}`, true);
                    }
                }   
            }
        }
        for (let i = 0; i < camps.length; i++) {
            hoverables.push(camps[i]);

            if( camps[i].Position[0] === current.Position[0] && camps[i].Position[1] === current.Position[1]) {
                rotationIndexes.set(`${i}`, true);
            }
        }

        // check if multiple units on hoverable position, rotate if possible
        if(rotationIndexes.size > 1) {
            const lookup = current.Index.join(',');

            if(direction === 0 || direction === 2) { // iterate forwards 1
                const keys = Array.from(rotationIndexes.keys());
                const index = keys.indexOf(lookup);

                if (index !== -1 && index < keys.length - 1) {
                    const nextKey = keys[index + 1];
                    const arr = nextKey.split(',').map(Number);

                    if (arr.length === 1 || arr.length === 3) {
                        hovIdx = arr;
                        return;
                    }
                    
                }
            }
            else if(direction === 1 || direction === 3) { // iterate backwards 1
                const keys = Array.from(rotationIndexes.keys());
                const index = keys.indexOf(lookup);

                if (index > 0) {
                    const prevKey = keys[index - 1];
                    const arr = prevKey.split(',').map(Number);

                    if (arr.length === 1 || arr.length === 3) {
                        hovIdx = arr;
                        return;
                    } 
                }
            }
            
        }

        let dx = 0, dy = 0;
        if (direction === 0) {dy =  1;}        // up
        if (direction === 1) {dx = -1;}        // left
        if (direction === 2) {dx =  1;}        // right
        if (direction === 3) {dy = -1;}        // down

        for (const h of hoverables) {
            if (h.Position[0] === current.Position[0] && h.Position[1] === current.Position[1]) continue;

            const vx = h.Position[0] - current.Position[0];
            const vy = h.Position[1] - current.Position[1];

            const dot = vx * dx + vy * dy;
            const mag = Math.sqrt(vx * vx + vy * vy);
            const dirMag = Math.sqrt(dx * dx + dy * dy);
            
            if (mag === 0 || dirMag === 0) continue;

            const cosine = dot / (mag * dirMag);
            
            // Cosine of 45° = ~0.707; anything > that is inside a 90° cone
            if (cosine < 0.7071) continue;

            const dist = vx * vx + vy * vy;
            if (dist < bestDist) {
                bestDist = dist;
                best = h;
            }
        }

        if(best) {
            hovIdx = best.Index;
            return;
        }

        const BOARD_W = 510;   // logical width  of the map + 10 for ties
        const BOARD_H = 510;   // logical height of the map + 10 for ties

        const ghostX = current.Position[0] - dx * BOARD_W;
        const ghostY = current.Position[1] - dy * BOARD_H;

        for (const h of hoverables) {
            if (h.Position === current.Position) continue;

            const vx = h.Position[0] - ghostX;
            const vy = h.Position[1] - ghostY;

            const dot = vx * dx + vy * dy;
            const mag = Math.sqrt(vx * vx + vy * vy);
            const dirMag = Math.sqrt(dx * dx + dy * dy);

            if (mag === 0 || dirMag === 0) continue; // avoid divide-by-zero

            const cosine = dot / (mag * dirMag);

            // Cosine of 45° = ~0.707; anything > that is inside a 90° cone
            if (cosine < 0.7071) continue;

            const dist = vx * vx + vy * vy;
            if (dist < bestDist) {
                bestDist = dist;
                best = h;
            }
        }
            
        if(best) {
            hovIdx = best.Index;
        }
    }

    function findPath(startingNode, target) {

        let targetCoordinate = target.Position;

        // check if direct path from starting node, if so, add that and return
        let available = true;
        for (let j = 0; j < obstacles.length; j++) {
            if(obstacles[j].Shape==="BEZIER") {
                if (lineIntersectsBezier(startingNode, targetCoordinate, obstacles[j]) == true) {
                    available = false;
                    break;
                }
            }
        }
        if (available == true) {
            let ans = [];
            ans.push( startingNode );
            ans.push( targetCoordinate );
            paths.push(ans);
            console.log("direct path found");
            return true;
        }

        // add a dynamic node to the global dynamic array
        const start1 = performance.now()
        const destPossible = addToIntersections(targetCoordinate);
        const end1 = performance.now();
        console.log(`addToIntersections executed in ${end1 - start1} ms`, destPossible);

        if (destPossible) {
            // calculate distance from unit to dynamic location
            const start2 = performance.now();
            //paths.push(oldAStar(startingNode, dynamics[dynamics.length - 1]));
            const end2 = performance.now();
            console.log(`AStar executed in ${end2 - start2} ms`);

            // remove dynamic location
            const start3 = performance.now()
            removeFromIntersections();
            const end3 = performance.now();
            console.log(`Removing Destination executed in ${end3 - start3} ms`);
            return true;
        }

        return false;

    }

    function returnPath(start, end) {
        const myAStar = new aStar(intersections);
        myAStar.addNode(start[0], start[1]);
        myAStar.addNode(end[0], end[1]);
        return myAStar.computePath(start[0], start[1], end[0], end[1]);
    }

    function lineIntersectsBezier(P1, P2, B) {
        const line = {p1: {x: P1[0], y: P1[1]}, p2: {x: P2[0], y: P2[1]}};
        const intersections = B.intersects(line);
        if (intersections.length > 0) {
            return true
        }
        return false
    }

    function addToIntersections(dest) {

        const newIntersection = {};
        newIntersection.Position = dest;

        let starting_paths = [];
        let starting_lengths = [];

        for (let i = 0; i < intersections.length; i++) {

            let available = true;
            for (let j = 0; j < obstacles.length; j++) {
                if(obstacles[j].Shape=="BEZIER") {
                    if( lineIntersectsBezier(newIntersection, intersections[i], obstacles[j]) ) {
                        available = false;
                        break;
                    }
                }
            }
            if (available) {
                starting_paths.push( i );
                starting_lengths.push(getDistance(newIntersection.Position, intersections[i]));
                intersections[i].Edges.push( dynamics.length );
                intersections[i].EdgeLengths.push(getDistance(newIntersection, intersections[i]));
            }
        }

        if (starting_paths.length == 0) {
            return false;
        }
        newIntersection.Edges = starting_paths;
        newIntersection.EdgeLengths = starting_lengths;
        dynamics.push(newIntersection);
        return true;
    }

    function removeFromIntersections() {
        for (let i = 0; i < dynamics.length; i++) {
            for (let j = 0; j < dynamics[i].Edges.length; j++) {
                if (dynamics[i].Edges[j][0] == 'i') {
                    intersections[parseInt(dynamics[i].Edges[j].slice(1))].Edges.pop();
                    intersections[parseInt(dynamics[i].Edges[j].slice(1))].EdgeLengths.pop();
                }
            }
        }
        dynamics = [];
    }

    function getPathLength(p) {
        let total = 0;
        for(let i = 0; i + 1 < p.length; i++) {
            const lenX = p[i+1][0] - p[i][0];
            const lenY = p[i+1][1] - p[i][1];
            total += Math.sqrt( (lenX * lenX) + (lenY * lenY) );
        }
        return total;
    }

        let readyUnit = -1;

            // randomly chose a random unit
            const randomUnit = Math.floor(Math.random() * (unitCount + campCount));

            let endPos;
            let destinationType = 0;
            let destinationIndex = [];
            if( randomUnit < unitCount ) {
                let count = 0;
                for(let i = 0; i < state.length; i++) {
                    for(let j = 0; j < state[i].length; j++) {
                        for(let k = 0; k < state[i][j].length; k++) {
                            if(randomUnit === count) {
                                endPos = state[i][j][k].Position;
                                destinationIndex = [i,j,k];
                                destinationType = 1;
                                break;
                            }
                            count += 1;
                        }
                    }
                }                
            } else {
                endPos = camps[randomUnit - unitCount].Position;
                destinationType = 0;
                destinationIndex = [randomUnit - unitCount];
            }

            // find path from ready unit to random unit
            const foundPath = returnPath(state[my_team][my_int][readyUnit].Position, endPos);

            if(foundPath.length > 0) {
                socket.send(JSON.stringify({
                    "Event": 'act',
                    "Message": "",
                    "UnitIndex": state[my_team][my_int][readyUnit].Index,
                    "destinationType": destinationType,
                    "destinationIndex": destinationIndex,
                }));
                randomMove = my_team.toString() + my_int.toString() + readyUnit.toString() + '->' + destinationIndex.toString() + ' | ' + JSON.stringify(foundPath);
                randomMoveFrameCount = 120;
            } else {
                randomMove = "notfound123";
                randomMoveFrameCount = 60;
            }
            

            
        } else {
            randomMove = "testing123";
            randomMoveFrameCount = 60;
        }
    }

    function main() {

        if (!window["WebSocket"]) {
            alert("Error: Your browser does not support web sockets.")
        } else {
            socket = new WebSocket("ws://{{.host}}/msocket?matchid={{.mid}}");
            socket.onclose = function () {
                alert("Connection has been closed.");
            }

            socket.onmessage = function (e) {
                var receive_time = Date.now()
                var msg = eval('(' + e.data + ')');
                console.log("msg received", msg.Event)

                var msg_date = msg.When.substring(0, 10);
                var msg_time = msg.When.substring(11, 19);

                if (msg.Event == 'clockSyncRequest') {
                    console.log("dif", Date.parse(msg.When) - receive_time)
                    socket.send(JSON.stringify({"Event": 'clockSyncResponse', "Message": receive_time.toString()}))
                } else if (msg.Event == 'entered') {
                    event_log.push(msg_date + ' ' + msg_time + ' ' + msg.Name + ' has entered the game')
                    if (event_log.length >= 25) {
                        event_log.shift()
                    }
                } else if (msg.Event == 'left') {
                    event_log.push(msg_date + ' ' + msg_time + ' ' + msg.Name + ' has left the game')
                    if (event_log.length >= 25) {
                        event_log.shift()
                    }
                } else if (msg.Event == 'assignInt') {
                    let temp_string = msg.Message.split(";")
                    my_team = parseInt(temp_string[0])
                    my_int = parseInt(temp_string[1])
                } else if (msg.Event == 'ticker_start') {
                    sent_time = Date.parse(msg.Message)
                } else if (msg.Event == 'update_phase') {
                    if (phase == "null") {
                        phase = msg.Phase
                        if (phase == "CHARACTER SELECTION") {
                            document.getElementById("sel_but").insertAdjacentHTML('beforeend', "<button id='a1' onclick=endCharSelect()>finished</button>");
                        }
                    } else if (phase == "CHARACTER SELECTION") {
                        var menu2 = document.getElementById("sel_but");
                        menu2.remove();
                        phase = msg.Phase
                    }
                } else if (msg.Event == 'sel_finished') {
                    event_log.push(msg_date + ' ' + msg_time + ' ' + msg.Name + ' finished unit selection.')
                    if (event_log.length >= 25) {
                        event_log.shift()
                    }
                } else if (msg.Event == 'map') {
                    console.log("recieved map wsmessage");
                    let map = JSON.parse(msg.Message);

                    // populate intersection global data structure
                    for(let i = 0; i < map["Intersections"].length; i++) {
                        let newIntersect = new Object();
                        newIntersect.Position = map["Intersections"][i];
                        newIntersect.Edges = map["Edges"][i];
                        newIntersect.EdgeLengths = map["EdgeLengths"][i];
                        intersections.push(newIntersect);
                    }

                    // population obstacles global data structure
                    for(let i = 0; i < map["Obstacles"].length; i++) {
                        if(map["Obstacle_type"][i]=="BEZIER") {
                            let curve = new Bezier(
                                map["Obstacles"][i][0], map["Obstacles"][i][1],
                                map["Obstacles"][i][2], map["Obstacles"][i][3],
                                map["Obstacles"][i][4], map["Obstacles"][i][5],
                                map["Obstacles"][i][6], map["Obstacles"][i][7]
                            );
                            curve.Shape = map["Obstacle_type"][i];
                            obstacles.push(curve)
                        } else if(map["Obstacle_type"][i]=="CIRCLE") {
                            let newObs = new Object();
                            newObs.EAngle = map["Obstacles"][i][0];
                            newObs.SAngle = map["Obstacles"][i][1];
                            newObs.R = map["Obstacles"][i][2];
                            newObs.Position = [ map["Obstacles"][i][3], map["Obstacles"][i][4] ];
                            newObs.Shape = map["Obstacle_type"][i];
                            obstacles.push(newObs)
                        }
                    }

                } else if (msg.Event == 'game_state') {
                    console.log("received game_state")

                    if (phase == "CHARACTER SELECTION") {
                        let temp = msg.TCH;
                        let md = [];
                        for (let i = 0; i < temp.length; i++) {
                            md[i] = [];
                            for (let j = 0; j < temp[i].length; j++) {
                                md[i][j] = [];
                                for (let k = 0; k < temp[i][j].length; k++) {
                                    md[i][j][k] = JSON.parse(temp[i][j][k]);
                                }
                            }
                        }

                        let cdata = [];
                        for (let i = 0; i < msg.Camps.length; i++) {
                            cdata.push(JSON.parse(msg.Camps[i]));
                        }

                        state = md;
                        camps = cdata;

                    } else {
                        turn_queue.push(msg.Turn)
                        time_queue.push(msg.UnitsOfTime)

                        // turn the JSON into javascript objects
                        let temp = msg.TCH;
                        let md = [];
                        for (let i = 0; i < temp.length; i++) {
                            md[i] = [];
                            for (let j = 0; j < temp[i].length; j++) {
                                md[i][j] = [];
                                for (let k = 0; k < temp[i][j].length; k++) {
                                    md[i][j][k] = JSON.parse(temp[i][j][k]);
                                }
                            }
                        }

                        let cdata = [];
                        for (let i = 0; i < msg.Camps.length; i++) {
                            cdata.push(JSON.parse(msg.Camps[i]))
                        }


                        // this triggers if they refreshed the page
                        if (animating_state == -1) {
                            let temp_string = msg.Message.split(";")
                            my_team = parseInt(temp_string[0])
                            my_int = parseInt(temp_string[1])
                            state = md;
                            animating_state = 0
                            camps = cdata
                            
                            setupHoverable()

                        }

                        match_data.push(md)
                        SPDTable.push(msg.SPDTable)
                        camp_data.push(cdata)

                        if (msg.Atk == null) {
                            atk_data.push([])
                        } else {
                            atk_data.push(msg.Atk)
                        }
                    }
                } else if (msg.Event == 'game_over') {
                    game_over = true
                    document.getElementById("test").insertAdjacentHTML('beforeend', "<button id='b1' onclick=returntomatchmaking()>RETURN TO MATCHMAKING</button>");
                }
            }
        }
    }

    main()

</script>
